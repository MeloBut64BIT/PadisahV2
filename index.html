<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d0905">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <title>Padişah: Elçiler</title>
    <!-- Use font-display: swap for performance -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="game-container">
<!-- Main Menu -->
    <div id="main-menu">
        <h1 id="game-title">Padişahım Çok Yaşa</h1>
        <div class="menu-buttons">
            <button id="btn-new-game" class="menu-btn">Yeni Oyun</button>
            <button id="btn-continue" class="menu-btn">Devam Et</button>
            <button id="btn-exit" class="menu-btn">Çıkış</button>
        </div>
    </div>

    <div id="scene-container">
        <div id="scene-image">
            <div id="particle-layer"></div>
            <img id="padisah-char" src="assets/padisah.png?v=2" alt="Padişah">
            <div class="envoy-hotspot" id="hotspot-vezir" data-envoy="vezir">
                <img class="envoy-char" src="assets/vezir.png?v=2" alt="Vezir">
            </div>
            <div class="envoy-hotspot" id="hotspot-serdar" data-envoy="serdar">
                <img class="envoy-char" src="assets/serdar.png?v=2" alt="Serdar">
            </div>
            <div class="envoy-hotspot" id="hotspot-hazine" data-envoy="hazine">
                <img class="envoy-char" src="assets/hazine.png?v=2" alt="Hazine Nazırı">
            </div>
        </div>
    </div>

    <div id="hud">
        <div id="day-counter">
            Gün <span id="day-val">1</span>
        </div>
        <div id="stats-container">
            <div class="stat-item">
                <div class="stat-header"><span>Halk</span><span id="val-halk">50</span></div>
                <div class="stat-bar-bg"><div class="stat-bar-fill stat-fill-halk" id="bar-halk"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-header"><span>Asker</span><span id="val-asker">50</span></div>
                <div class="stat-bar-bg"><div class="stat-bar-fill stat-fill-asker" id="bar-asker"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-header"><span>Gelir</span><span id="val-gelir">50</span></div>
                <div class="stat-bar-bg"><div class="stat-bar-fill stat-fill-gelir" id="bar-gelir"></div></div>
            </div>
            <div class="stat-item">
                <div class="stat-header"><span>Din</span><span id="val-din">50</span></div>
                <div class="stat-bar-bg"><div class="stat-bar-fill stat-fill-din" id="bar-din"></div></div>
            </div>
        </div>
    </div>

    <div id="dark-overlay"></div>

    <div id="dialog-panel">
        <div id="dialog-header">
            <h2 id="dialog-title">Elçi</h2>
            <button id="close-btn">X</button>
        </div>
        <div id="dialog-text">Mesele...</div>
        <div id="options-container"></div>
        <div id="dialog-nav">
            <button class="nav-btn" id="nav-left">◀</button>
            <button class="nav-btn" id="nav-right">▶</button>
        </div>
    </div>

    <div id="notification">Sonuç...</div>

    <div id="fade-overlay">
        <h1 id="fade-day-text">Gün 2</h1>
    </div>

    <div id="game-over">
        <h1 id="game-over-title">Oyun Bitti</h1>
        <h2 id="game-over-subtitle">Unvan</h2>
        <p id="game-over-text">Bitiş açıklaması...</p>
        <button id="restart-btn">Yeniden Başla</button>
    </div>
</div>

<script src="data/events.js?v=2"></script>
<script src="game.js?v=2"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('Service Worker registered', reg);
      }).catch(err => {
        console.warn('Service Worker registration failed', err);
      });
    });
  }
</script>
</body>
</html>
